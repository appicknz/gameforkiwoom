# Fly.io 설정 파일
app = "btc-price-server"
primary_region = "nrt"  # 도쿄 (아시아 최저 레이턴시)

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"

[http_service]
internal_port = 8080
force_https = false

[[services]]
processes = ["app"]
protocol = "tcp"
port = 8080
handlers = ["http", "tls"]
internal_port = 8080

[[statics]]
guest_path = "/"
url_prefix = "/"

[checks]
  [checks.tcp]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
